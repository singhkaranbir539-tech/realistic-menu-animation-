<!doctype html>
<html><head><meta charset="utf-8"><title>Muscle Growth Renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:540px;height:960px}</style>
</head><body><canvas id="c"></canvas>
<script>
/* ==========================================================================
   THE SCIENCE OF EXTREME MUSCLE GROWTH — procedural renderer
   Logical canvas 1080x1920, rendered at SCALE (2 => 2160x3840).
   window.init(data) then window.frame(n) -> JPEG data URL.
   ========================================================================== */
const W = 1080, H = 1920, FPS = 30;
let SCALE = 2, cv, ctx, DATA = null;
const COL = { black:'#040508', blue:'#2fa8ff', blue2:'#7fd0ff', orange:'#ff7a1a', orange2:'#ffb15c',
  red:'#b3122b', red2:'#e8364f', silver:'#c9d1d9', white:'#f4f7fb' };

/* ---------- math helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const eo=x=>1-Math.pow(1-clamp(x),3);
const ei=x=>Math.pow(clamp(x),3);
const frac=x=>x-Math.floor(x);
const TAU=Math.PI*2;
function noise1(x){const i=Math.floor(x),f=x-i;const h=n=>frac(Math.sin(n*127.1+311.7)*43758.5453);const u=f*f*(3-2*f);return lerp(h(i),h(i+1),u)*2-1;}

/* ---------- glow sprites ---------- */
const GLOW = {};
function glowSprite(color){
  if(GLOW[color]) return GLOW[color];
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,color);gr.addColorStop(0.18,color+'cc');gr.addColorStop(0.45,color+'44');gr.addColorStop(1,color+'00');
  g.fillStyle=gr;g.fillRect(0,0,256,256);GLOW[color]=c;return c;
}
function glow(x,y,r,color,a=1){ if(a<=0.003||r<=0.5) return; ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=clamp(a);ctx.drawImage(glowSprite(color),x-r,y-r,r*2,r*2);ctx.restore(); }
function withAlpha(a,fn){ctx.save();ctx.globalAlpha*=clamp(a);fn();ctx.restore();}

/* ---------- text ---------- */
function font(px,w=800){return `${w} ${px}px Inter, "Inter Display", "DejaVu Sans", sans-serif`;}
function spaced(text,x,y,px,w,spacing,align='center',color=COL.white){
  ctx.font=font(px,w); ctx.fillStyle=color;
  const chars=[...text]; const widths=chars.map(c=>ctx.measureText(c).width);
  const total=widths.reduce((a,b)=>a+b,0)+spacing*(chars.length-1);
  let cx = align==='center'? x-total/2 : align==='right'? x-total : x;
  ctx.textAlign='left'; ctx.textBaseline='middle';
  chars.forEach((c,i)=>{ctx.fillText(c,cx,y);cx+=widths[i]+spacing;});
  return total;
}
function wrapLines(text,maxW,px,w=800){ctx.font=font(px,w);const words=text.split(' ');const lines=[];let cur='';
  for(const wd of words){const test=cur?cur+' '+wd:wd;if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=wd;}else cur=test;}
  if(cur)lines.push(cur);return lines;}

/* ---------- background ---------- */
const DUST=(()=>{const r=rng(7);return Array.from({length:70},()=>({x:r()*W,y:r()*H,z:0.3+r()*0.7,s:r()*TAU,c:r()<0.7?COL.blue:COL.orange}));})();
function background(t,tint='#0a1424',dust=1){
  ctx.fillStyle=COL.black;ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H*0.42,50,W/2,H*0.45,H*0.75);
  g.addColorStop(0,tint);g.addColorStop(1,'#020203');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(dust>0) for(const d of DUST){const x=frac((d.x+t*12*d.z)/W)*W, y=frac((d.y-t*20*d.z+Math.sin(t*0.5+d.s)*20)/H)*H;
    glow(x,y,6+10*d.z,d.c,0.25*d.z*dust);}
}
function vignette(a=0.85){const g=ctx.createRadialGradient(W/2,H/2,H*0.32,W/2,H/2,H*0.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function hudGrid(a){ if(a<=0)return; ctx.save();ctx.globalAlpha=a*0.07;ctx.strokeStyle=COL.blue;ctx.lineWidth=1;
  for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();} ctx.restore();}

/* ---------- HUD tag ---------- */
function tag(text,x,y,lt,t0,opt={}){
  const a=seg(lt,t0,t0+0.35)*(opt.t1?1-seg(lt,opt.t1,opt.t1+0.3):1); if(a<=0)return;
  const color=opt.color||COL.blue, px=opt.px||30, align=opt.align||'center';
  const n=Math.floor(text.length*eo(seg(lt,t0,t0+0.6)));const shown=text.slice(0,n);
  ctx.save();ctx.globalAlpha=a;ctx.font=font(px,800);
  const tw=ctx.measureText(text).width+px*0.06*text.length; const bw=tw+px*1.2, bh=px*1.9;
  const bx= align==='center'? x-bw/2 : align==='right'? x-bw : x;
  ctx.fillStyle='rgba(6,12,22,0.72)';ctx.fillRect(bx,y-bh/2,bw*eo(seg(lt,t0,t0+0.3)),bh);
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.strokeRect(bx,y-bh/2,bw*eo(seg(lt,t0,t0+0.3)),bh);
  ctx.fillStyle=color;ctx.fillRect(bx,y-bh/2,6,bh);
  spaced(shown,bx+px*0.75,y+1,px,800,px*0.06,'left',opt.textColor||COL.white);
  if(opt.line){const [lx,ly]=opt.line;ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
    const sx=lx<bx?bx:(lx>bx+bw?bx+bw:lx), sy=ly<y?y-bh/2:y+bh/2;ctx.moveTo(sx,sy);ctx.lineTo(lerp(sx,lx,eo(seg(lt,t0+0.2,t0+0.6))),lerp(sy,ly,eo(seg(lt,t0+0.2,t0+0.6))));ctx.stroke();
    glow(lx,ly,14,color,eo(seg(lt,t0+0.5,t0+0.7)));}
  ctx.restore();
}

/* ==========================================================================
   NEURO — the brain mascot. Body baked once into an offscreen canvas so it is
   pixel-identical in every shot; face, glow and pulses are drawn live.
   ========================================================================== */
let BRAIN=null; const BW=900,BH=720;
function brainPath(g,w,h){ // front 3/4 brain silhouette in a w x h box centred at 0,0
  g.beginPath();
  const pts=[];const r=rng(3);
  for(let i=0;i<=120;i++){const a=i/120*TAU;
    let rx=w/2, ry=h/2;
    let x=Math.cos(a)*rx, y=Math.sin(a)*ry;
    if(y>0){y*=0.86; x*=1-0.12*(y/ry);}               // flatter underside
    const bump=1+0.035*Math.sin(a*9+1)+0.02*Math.sin(a*17);
    const notch = Math.exp(-Math.pow((a-Math.PI*1.5)/0.12,2))*0.07; // top fissure dip
    x*=bump; y*=bump*(1-notch);
    pts.push([x,y]);}
  g.moveTo(pts[0][0],pts[0][1]);for(const p of pts)g.lineTo(p[0],p[1]);g.closePath();
}
function buildBrain(){
  const c=document.createElement('canvas');c.width=BW;c.height=BH;const g=c.getContext('2d');
  g.translate(BW/2,BH/2);const w=BW*0.86,h=BH*0.84;
  brainPath(g,w,h);
  let gr=g.createRadialGradient(-w*0.12,-h*0.2,10,0,0,w*0.62);
  gr.addColorStop(0,'#f6c2cb');gr.addColorStop(0.45,'#d98a9a');gr.addColorStop(0.8,'#9a4a5e');gr.addColorStop(1,'#4a1726');
  g.fillStyle=gr;g.fill();
  g.save();brainPath(g,w,h);g.clip();
  // sulci: noise-walk curves, dark groove + light ridge
  const r=rng(11);
  // gyri: thick rounded folds = dark groove outline + pink body + soft top highlight
  g.lineCap='round';g.lineJoin='round';
  const curves=[];
  for(let k=0;k<95;k++){
    let x=(r()-0.5)*w*1.05, y=(r()-0.5)*h*1.05, ang=r()*TAU; const len=16+r()*22;
    const pts=[[x,y]];
    for(let s=0;s<len;s++){ang+=Math.sin(s*0.55+k)*0.55+(r()-0.5)*0.35;x+=Math.cos(ang)*7;y+=Math.sin(ang)*7;pts.push([x,y]);}
    curves.push(pts);}
  const stroke=(pts,dx,dy)=>{g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0]+dx,p[1]+dy):g.moveTo(p[0]+dx,p[1]+dy));g.stroke();};
  for(const pts of curves){
    const yy=pts[0][1]/h+0.5; // shade lower folds darker
    g.strokeStyle='rgba(88,20,40,0.85)';g.lineWidth=40;stroke(pts,0,3);
    g.strokeStyle=`rgb(${226-yy*60|0},${150-yy*55|0},${165-yy*50|0})`;g.lineWidth=29;stroke(pts,0,0);
    g.strokeStyle='rgba(255,225,232,0.45)';g.lineWidth=9;stroke(pts,-4,-6);
  }
  // longitudinal fissure
  g.strokeStyle='rgba(60,12,28,0.9)';g.lineWidth=9;g.beginPath();g.moveTo(0,-h*0.52);
  g.bezierCurveTo(8,-h*0.3,-6,-h*0.12,0,-h*0.02);g.stroke();
  // underside shadow (subsurface depth)
  gr=g.createLinearGradient(0,-h/2,0,h/2);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(0.6,'rgba(0,0,0,0.05)');gr.addColorStop(1,'rgba(20,0,10,0.65)');
  g.fillStyle=gr;g.fillRect(-w,-h,w*2,h*2);
  // orange subsurface warmth
  gr=g.createRadialGradient(w*0.1,h*0.1,10,w*0.1,h*0.1,w*0.5);gr.addColorStop(0,'rgba(255,140,60,0.22)');gr.addColorStop(1,'rgba(255,140,60,0)');
  g.fillStyle=gr;g.fillRect(-w,-h,w*2,h*2);
  // glossy specular
  gr=g.createRadialGradient(-w*0.2,-h*0.3,5,-w*0.2,-h*0.3,w*0.28);gr.addColorStop(0,'rgba(255,255,255,0.55)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(-w,-h,w*2,h*2);
  g.restore();
  // electric-blue rim light
  brainPath(g,w,h);gr=g.createLinearGradient(-w/2,0,w/2,0);gr.addColorStop(0,'rgba(80,190,255,0.95)');gr.addColorStop(0.5,'rgba(80,190,255,0.15)');gr.addColorStop(1,'rgba(120,210,255,0.9)');
  g.strokeStyle=gr;g.lineWidth=7;g.stroke();
  BRAIN={canvas:c,w,h};
}
// neural surface pulses (fixed paths on the brain surface)
const BRAIN_PULSES=(()=>{const r=rng(21);return Array.from({length:9},()=>{const pts=[];let x=(r()-0.5)*0.7,y=(r()-0.5)*0.6,a=r()*TAU;
  for(let i=0;i<14;i++){a+=(r()-0.5)*1.1;x+=Math.cos(a)*0.035;y+=Math.sin(a)*0.035;pts.push([clamp(x,-0.4,0.4),clamp(y,-0.36,0.3)]);}
  return {pts,speed:0.25+r()*0.4,off:r(),c:r()<0.75?COL.blue2:COL.orange2};});})();

let NEURO_STATE={x:872,y:300,s:1,vis:1,point:null,smile:0,brow:0,gaze:[0,0]};
function mouthEnv(t){ if(!DATA)return 0; const f=Math.floor(t*FPS); return DATA.env[clamp(f,0,DATA.env.length-1)]||0; }
function drawNeuro(t){
  const st=NEURO_STATE; if(st.vis<=0.001)return;
  if(!BRAIN)buildBrain();
  const env=mouthEnv(t), envS=(mouthEnv(t-0.1)+env+mouthEnv(t+0.07))/3;
  const width=330*st.s, sc=width/BW;
  const bob=Math.sin(t*1.25)*9*st.s, tilt=Math.sin(t*0.7)*0.045+ (envS-0.3)*0.05*Math.sin(t*2.1);
  const x=st.x, y=st.y+bob;
  ctx.save();ctx.globalAlpha*=st.vis;
  // pointing tendril
  if(st.point&&st.point[2]>0){const [px,py,pa]=st.point;ctx.save();ctx.globalAlpha*=pa;
    const sx=x-width*0.35, sy=y+width*0.18;ctx.strokeStyle='rgba(90,195,255,0.85)';ctx.lineWidth=3;ctx.lineCap='round';
    const reach=eo(pa);const ex=lerp(sx,px,reach), ey=lerp(sy,py,reach);
    const c1x=lerp(sx,ex,0.35), c1y=sy+60, c2x=lerp(sx,ex,0.7), c2y=ey-40;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.bezierCurveTo(c1x,c1y,c2x,c2y,ex,ey);ctx.stroke();
    ctx.lineWidth=1.2;ctx.strokeStyle='rgba(200,235,255,0.9)';ctx.stroke();
    const u=frac(t*1.4);const bx=(1-u)**3*sx+3*(1-u)**2*u*c1x+3*(1-u)*u*u*c2x+u**3*ex, by=(1-u)**3*sy+3*(1-u)**2*u*c1y+3*(1-u)*u*u*c2y+u**3*ey;
    glow(bx,by,22,COL.blue2,0.9);glow(ex,ey,26,COL.blue,0.8);ctx.restore();}
  // aura
  glow(x,y,width*0.95,COL.blue,0.35+envS*0.25);glow(x+width*0.1,y+width*0.1,width*0.5,COL.orange,0.12+envS*0.12);
  ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(sc,sc);
  ctx.drawImage(BRAIN.canvas,-BW/2,-BH/2);
  // surface neural pulses
  for(const p of BRAIN_PULSES){const u=frac(t*p.speed+p.off);const i=Math.floor(u*(p.pts.length-1));const q=p.pts[i];
    glow(q[0]*BRAIN.w,q[1]*BRAIN.h,40,p.c,0.55*Math.sin(u*Math.PI));}
  // ---- face ----
  const blinkPh=(t+0.37)%3.6, blink = blinkPh<0.16? Math.abs(Math.sin(blinkPh/0.16*Math.PI)) : 0;
  const gx=st.gaze[0]*14, gy=st.gaze[1]*10;
  for(const s of [-1,1]){
    const ex=s*BRAIN.w*0.19, ey=BRAIN.h*0.02;
    // socket shade
    ctx.fillStyle='rgba(40,6,20,0.55)';ctx.beginPath();ctx.ellipse(ex,ey+4,62,52,0,0,TAU);ctx.fill();
    const open=1-blink*0.92;
    ctx.save();ctx.beginPath();ctx.ellipse(ex,ey,48,42*open,0,0,TAU);ctx.clip();
    let gr=ctx.createRadialGradient(ex+gx,ey+gy,2,ex+gx,ey+gy,52);gr.addColorStop(0,'#e9f8ff');gr.addColorStop(0.25,'#59c4ff');gr.addColorStop(0.7,'#0f62c9');gr.addColorStop(1,'#04203f');
    ctx.fillStyle=gr;ctx.fillRect(ex-60,ey-60,120,120);
    ctx.fillStyle='#021226';ctx.beginPath();ctx.arc(ex+gx,ey+gy,15,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.95)';ctx.beginPath();ctx.arc(ex+gx-12,ey+gy-13,8,0,TAU);ctx.fill();
    ctx.restore();
    glow(ex,ey,95,COL.blue,0.55*open);
    // brow
    const by=ey-70-st.brow*16 - envS*5;ctx.strokeStyle='rgba(140,215,255,0.95)';ctx.lineWidth=9;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(ex-s*40,by+8+ (s>0?0:0));ctx.quadraticCurveTo(ex,by-10-st.brow*6,ex+s*44,by+2+st.brow*4*s*0);ctx.stroke();
  }
  // mouth (lip sync)
  const mo=clamp(envS*1.15), my=BRAIN.h*0.25, mw=86+mo*10;
  ctx.fillStyle='rgba(30,2,12,0.95)';ctx.beginPath();
  ctx.moveTo(-mw,my-st.smile*6);
  ctx.quadraticCurveTo(0,my+10+st.smile*18-2,mw,my-st.smile*6);
  ctx.quadraticCurveTo(0,my+16+mo*78+st.smile*14,-mw,my-st.smile*6);ctx.closePath();ctx.fill();
  if(mo>0.08){ctx.save();ctx.clip();glow(0,my+30+mo*20,70,COL.orange,0.5*mo);ctx.fillStyle='rgba(200,70,90,0.8)';ctx.beginPath();ctx.ellipse(0,my+22+mo*60,mw*0.45,18,0,0,TAU);ctx.fill();ctx.restore();}
  ctx.strokeStyle='rgba(255,170,150,0.7)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-mw-6,my-st.smile*8-2);ctx.quadraticCurveTo(0,my+8+st.smile*18-4,mw+6,my-st.smile*8-2);ctx.stroke();
  ctx.restore();
  // name plate
  ctx.save();ctx.globalAlpha*=st.vis*0.85;spaced('NEURO',x,y+width*0.47,17*st.s,800,6,'center',COL.blue2);ctx.restore();
}

/* ==========================================================================
   Reusable 3D-ish assets
   ========================================================================== */
// --- muscle bundle: fibres on a spindle, rotated in 3D, painter-sorted ---
const FIBRES=(()=>{const r=rng(5);return Array.from({length:150},()=>({th:r()*TAU,rho:Math.sqrt(0.15+r()*0.85),tw:0.4+r()*0.5,ph:r(),w:0.7+r()*0.6}));})();
function drawMuscle(cx,cy,len,R,rot,t,o={}){
  const tilt=o.tilt||0, swell=o.swell||1, glowA=o.glow??0.6, hue=o.hue||'red', stretch=o.stretch||0, heal=o.heal||0;
  const steps=22, f=900;
  const list=[];
  for(const fb of FIBRES){const pts=[];let zs=0;
    for(let i=0;i<=steps;i++){const u=i/steps;const prof=Math.pow(Math.sin(Math.PI*(0.04+u*0.92)),0.85);
      const th=fb.th+u*fb.tw+rot;const rr=R*swell*prof*fb.rho;
      let x=Math.cos(th)*rr, z=Math.sin(th)*rr, y=(u-0.5)*len*(1+stretch*0.25);
      const s=f/(f+z);pts.push([x*s,y*s,z,Math.cos(th)]);zs+=z;}
    list.push({fb,pts,z:zs/steps});}
  list.sort((a,b)=>b.z-a.z);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(tilt);ctx.lineCap='round';
  // tendons
  ctx.strokeStyle='rgba(205,215,225,0.85)';ctx.lineWidth=R*0.16;
  ctx.beginPath();ctx.moveTo(0,-len*(0.5+stretch*0.125));ctx.lineTo(0,-len*(0.5+stretch*0.125)-R*0.9);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,len*(0.5+stretch*0.125));ctx.lineTo(0,len*(0.5+stretch*0.125)+R*0.9);ctx.stroke();
  for(const L of list){const depth=clamp(0.5-L.z/(R*2.2));const light=clamp(0.35+0.65*(0.5+0.5*L.pts[steps>>1][3])*depth+0.1);
    let r,g,b; if(hue==='blue'){r=40;g=110;b=200;} else {r=180;g=22;b=40;}
    if(heal>0){r=lerp(r,60,heal*0.5);g=lerp(g,150,heal*0.5);b=lerp(b,230,heal*0.5);}
    ctx.strokeStyle=`rgb(${(r*light+40*light*light)|0},${(g*light+20*light*light)|0},${(b*light+25*light*light)|0})`;
    ctx.lineWidth=R*0.075*L.fb.w*(0.6+depth*0.6);
    ctx.beginPath();L.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
    if(light>0.75){ctx.strokeStyle=`rgba(255,${hue==='blue'?220:150},${hue==='blue'?255:140},${(light-0.75)*1.2})`;ctx.lineWidth*=0.35;ctx.stroke();}
  }
  // travelling activation pulses
  if(glowA>0) for(let k=0;k<list.length;k+=5){const L=list[k];if(L.z>0)continue;const u=frac(t*(0.35+L.fb.ph*0.3)+L.fb.ph);const p=L.pts[Math.floor(u*steps)];
    glow(p[0],p[1],R*0.22,hue==='blue'||heal>0.5?COL.blue2:COL.orange,glowA*Math.sin(u*Math.PI));}
  ctx.restore();
  glow(cx,cy,R*2.4,hue==='blue'?COL.blue:COL.red2,0.18*glowA);
}

// --- ball-and-stick / hexagon-unit molecule in 3D ---
function project(p,ry,rx,f=800){let [x,y,z]=p;let c=Math.cos(ry),s=Math.sin(ry);[x,z]=[x*c+z*s,-x*s+z*c];c=Math.cos(rx);s=Math.sin(rx);[y,z]=[y*c-z*s,y*s+z*c];const k=f/(f+z);return [x*k,y*k,z,k];}
function atom(x,y,r,col){const g=ctx.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(0.3,col);g.addColorStop(1,'#05080d');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
const GLUCOSE=(()=>{const atoms=[],bonds=[];for(let i=0;i<6;i++){const a=i/6*TAU;atoms.push({p:[Math.cos(a)*60,Math.sin(a)*60,(i%2?1:-1)*12],e:i===0?'O':'C'});}
  for(let i=0;i<6;i++)bonds.push([i,(i+1)%6]);
  for(let i=1;i<6;i++){const a=i/6*TAU;atoms.push({p:[Math.cos(a)*105,Math.sin(a)*105,(i%2?1:-1)*40],e:'OH'});bonds.push([i,atoms.length-1]);}

// --- sarcomere / myofibril macro view ---
function sarcomeres(t,stretch,o={}){
  const rows=o.rows||4, y0=o.y0||620, gap=o.gap||200, tension=o.tension??0.7;
  for(let r=0;r<rows;r++){const y=y0+r*gap+Math.sin(t*0.8+r)*6, h=120;const drift=(t*18+r*90)%1;
    // tube
    const g=ctx.createLinearGradient(0,y-h/2,0,y+h/2);g.addColorStop(0,'#2a0710');g.addColorStop(0.5,'#5c1020');g.addColorStop(1,'#1a040a');
    ctx.fillStyle=g;ctx.fillRect(0,y-h/2,W,h);
    ctx.strokeStyle='rgba(255,120,110,0.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,y-h/2);ctx.lineTo(W,y-h/2);ctx.stroke();
    const sl=230*(1+stretch*0.45);const off=-((t*25+r*70)%sl);
    for(let x=off-sl;x<W+sl;x+=sl){
      // actin from Z lines
      ctx.strokeStyle='rgba(230,70,80,0.9)';ctx.lineWidth=4;
      for(let k=-2;k<=2;k++){const yy=y+k*20;const aw=sl*0.33;
        ctx.beginPath();ctx.moveTo(x,yy+10);ctx.lineTo(x+aw,yy+10);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x+sl,yy+10);ctx.lineTo(x+sl-aw,yy+10);ctx.stroke();}
      // myosin thick filaments (fixed length → overlap falls as sarcomere lengthens)
      ctx.strokeStyle=`rgba(255,${140+tension*60|0},60,0.95)`;ctx.lineWidth=8;
      for(let k=-2;k<2;k++){const yy=y+k*20+20;ctx.beginPath();ctx.moveTo(x+sl/2-75,yy);ctx.lineTo(x+sl/2+75,yy);ctx.stroke();}
      glow(x+sl/2,y,70,COL.orange,0.12+tension*0.25*(0.6+0.4*Math.sin(t*6+x*0.01)));
      // Z line
      ctx.strokeStyle='rgba(215,225,235,0.95)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y-h/2+8);ctx.lineTo(x+8,y);ctx.lineTo(x,y+h/2-8);ctx.stroke();
      glow(x,y,40,COL.blue2,0.3);

  }

  const a=o.arrows??1; if(a>0){ctx.save();ctx.globalAlpha*=a;for(const s of [-1,1]){const x=W/2+s*(330+stretch*60);

    ctx.fillStyle=COL.blue2;ctx.beginPath();ctx.moveTo(x+s*60,y0-140);ctx.lineTo(x+s*30,y0-160);ctx.lineTo(x+s*30,y0-120);ctx.closePath();ctx.fill();glow(x,y0-140,50,COL.blue,0.5);}ctx.restore();}
}

// --- neural network fly-through ---
const NET=(()=>{const r=rng(33);const nodes=Array.from({length:260},()=>[(r()-0.5)*1400,(r()-0.5)*2400,r()*3000]);const edges=[];
  for(let i=0;i<nodes.length;i++){let best=[];for(let j=0;j<nodes.length;j++){if(i===j)continue;const d=Math.hypot(nodes[i][0]-nodes[j][0],nodes[i][1]-nodes[j][1],nodes[i][2]-nodes[j][2]);best.push([d,j]);}
    best.sort((a,b)=>a[0]-b[0]);for(let k=0;k<2;k++)if(best[k][0]<520)edges.push([i,best[k][1],r()]);}
  return {nodes,edges};})();
function neuralFly(t,camZ,a=1,col=COL.blue){withAlpha(a,()=>{const f=700;const P=NET.nodes.map(n=>{const z=((n[2]-camZ)%3000+3000)%3000+40;const k=f/z;return [W/2+n[0]*k,H/2+n[1]*k,z,k];});

    const u=frac(t*0.6+ph*3);if(depth>0.3)glow(lerp(A[0],B[0],u),lerp(A[1],B[1],u),10+30*depth,ph>0.8?COL.orange:col,depth);}

/* ---------- title card ---------- */
function titleCard(S,lt){
  const big=seg(lt,0.5,1.0)*(1-seg(lt,3.6,4.2));
  const id=String(S.id).padStart(2,'0');
  if(big>0)withAlpha(big,()=>{const lines=wrapLines(S.title,820,58,900);const y0=H*0.36-(lines.length-1)*34;
    const bg=ctx.createLinearGradient(0,y0-170,0,y0+lines.length*68+60);bg.addColorStop(0,'rgba(2,4,8,0)');bg.addColorStop(0.25,'rgba(2,4,8,0.78)');bg.addColorStop(0.75,'rgba(2,4,8,0.78)');bg.addColorStop(1,'rgba(2,4,8,0)');ctx.fillStyle=bg;ctx.fillRect(0,y0-170,W,lines.length*68+230);
    spaced('CHAPTER '+id+' / 10',W/2,y0-78,20,800,8,'center',COL.orange2);
    lines.forEach((l,i)=>spaced(l,W/2,y0+i*68,58,900,4,'center',COL.white));
    const lw=520*eo(seg(lt,0.6,1.4));ctx.strokeStyle=COL.blue;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2-lw/2,y0+lines.length*68-20);ctx.lineTo(W/2+lw/2,y0+lines.length*68-20);ctx.stroke();
    glow(W/2,y0+lines.length*68-20,60,COL.blue,0.6);});
  const small=seg(lt,3.8,4.4);
  if(small>0)withAlpha(small*0.9,()=>{const lines=wrapLines(S.title,520,22,800);
    ctx.fillStyle=COL.orange;ctx.fillRect(56,232,4,30+lines.length*28);
    spaced(id,74,248,20,900,3,'left',COL.orange2);lines.forEach((l,i)=>spaced(l,74,276+i*28,22,800,3,'left',COL.white));});
}

/* ---------- captions ---------- */
function captions(t){
  if(!DATA)return;const c=DATA.captions.find(c=>t>=c.start-0.05&&t<c.end+0.12);if(!c)return;
  const S=DATA.scenes.find(s=>s.id===c.scene);const keys=S?S.keys:[];
  const pop=eo(seg(t,c.start-0.05,c.start+0.12));
  const px=60, y=1530;
  const words=c.text.split(' ');ctx.font=font(px,900);
  const sp=ctx.measureText(' ').width;
  // line wrap at 900px
  const lines=[[]];let lw=0;for(const w of words){const ww=ctx.measureText(w).width;if(lw+ww>920&&lines[lines.length-1].length){lines.push([]);lw=0;}lines[lines.length-1].push(w);lw+=ww+sp;}
  const dur=c.end-c.start, chars=c.text.length;let charAcc=0;
  ctx.save();ctx.translate(W/2,y);ctx.scale(0.92+0.08*pop,0.92+0.08*pop);ctx.globalAlpha*=pop;
  lines.forEach((ln,li)=>{const tot=ln.reduce((a,w)=>a+ctx.measureText(w).width,0)+sp*(ln.length-1);let x=-tot/2;const yy=(li-(lines.length-1)/2)*78;
    for(const w of ln){const clean=w.toLowerCase().replace(/[^a-z0-9\-]/g,'');const key=keys.some(k=>clean===k||clean.startsWith(k));
      const wStart=c.start+dur*charAcc/chars;charAcc+=w.length+1;const spoken=t>=wStart;
      ctx.font=font(px,900);ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.lineWidth=10;ctx.strokeStyle='rgba(0,0,0,0.85)';ctx.lineJoin='round';ctx.strokeText(w,x,yy);
      ctx.fillStyle=key?COL.orange:(spoken?COL.white:'rgba(244,247,251,0.82)');ctx.fillText(w,x,yy);
      if(key)glow(x+ctx.measureText(w).width/2,yy,ctx.measureText(w).width*0.6,COL.orange,0.18);
      x+=ctx.measureText(w).width+sp;}});
  ctx.restore();
}

/* ---------- transitions ---------- */
function transIn(kind,lt){
  if(kind==='black'){const a=1-seg(lt,0,1.2);if(a>0){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);}return;}
  if(kind==='flash'){const a=1-seg(lt,0,0.5);if(a>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(120,200,255,${a*0.6})`;ctx.fillRect(0,0,W,H);ctx.restore();
    for(let k=0;k<14;k++){const ang=k/14*TAU;ctx.strokeStyle=`rgba(200,235,255,${a})`;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2+Math.cos(ang)*100,H/2+Math.sin(ang)*100);ctx.lineTo(W/2+Math.cos(ang)*(200+900*(1-a)),H/2+Math.sin(ang)*(200+900*(1-a)));ctx.stroke();}}return;}
  if(kind==='depth'){const a=1-seg(lt,0,0.7);if(a>0){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);}return;}
}
function transOut(kind,rem){ // rem = seconds remaining in scene
  if(kind==='flash'){const a=1-seg(rem,0,0.45);if(a>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(120,200,255,${a*0.6})`;ctx.fillRect(0,0,W,H);ctx.restore();}}
  if(kind==='depth'||kind==='black'){const a=1-seg(rem,0,kind==='black'?1.6:0.6);if(a>0){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);}}
}
function whipOffset(S,lt){const rem=S.end-S.start-lt;let o=0;if(S.tout==='whip')o-=ei(1-seg(rem,0,0.4))*W*1.2;if(S.tin==='whip')o+=(1-eo(seg(lt,0,0.4)))*W*1.2;return o;}
function whipStreaks(S,lt){const rem=S.end-S.start-lt;const a=Math.max(S.tout==='whip'?1-seg(rem,0,0.4):0,S.tin==='whip'?1-seg(lt,0,0.4):0);if(a<=0)return;
  const r=rng(77);ctx.save();ctx.globalCompositeOperation='lighter';for(let k=0;k<40;k++){const y=r()*H;ctx.strokeStyle=`rgba(${r()<0.5?'120,200,255':'255,150,80'},${a*0.5*r()})`;ctx.lineWidth=1+r()*5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.restore();}

/* ---------- frame ---------- */
function drawFrame(t){
  ctx.setTransform(SCALE,0,0,SCALE,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  const S=SCENES.find(s=>t>=s.start&&t<s.end)||SCENES[SCENES.length-1];const lt=t-S.start;
  NEURO_STATE={x:872,y:300,s:1,vis:1,point:null,smile:0,brow:0,gaze:[-0.25,0.15]};
  ctx.save();ctx.translate(whipOffset(S,lt),0);S.draw(lt,t);ctx.restore();
  whipStreaks(S,lt);
  vignette(0.7);
  titleCard(S,lt);
  transIn(S.tin,lt);transOut(S.tout==='black'?'none':S.tout,S.end-S.start-lt);
  // presenter: appears in scene 1, persistent afterwards
  if(S.id===1){NEURO_STATE.vis=eo(seg(lt,1.0,1.8));if(lt>1&&lt<1.6)glow(872,300,300*(1-seg(lt,1,1.6)),COL.blue2,1);}
  const endFade=S.id===10?seg(lt,15.6,17):0;
  NEURO_STATE.vis*=1-endFade;
  drawNeuro(t);
  captions(t);
  if(S.id===10){const a=seg(lt,15.4,17);if(a>0){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);}}
}
window.init=function(data,scale){DATA=data;SCALE=scale||2;cv=document.getElementById('c');cv.width=W*SCALE;cv.height=H*SCALE;ctx=cv.getContext('2d');buildBrain();return true;};
window.frame=function(n,q){drawFrame(n/FPS);return cv.toDataURL('image/jpeg',q||0.92);};
window.cues=function(){return SCENES.map(s=>({id:s.id,start:s.start,end:s.end,tin:s.tin,tout:s.tout}));};
